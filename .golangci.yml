version: "2"
linters:
  settings:
    errcheck:
      # Best-effort cleanup; failures here are not actionable.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.DB).Close
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Listener).Close
        - (*gopkg.in/yaml.v3.Encoder).Close
        - (*caldo/internal/store.Store).Close
        - os.Remove
        - github.com/zalando/go-keyring.Delete
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
