# CalDo configuration — copy to ~/.config/caldo/config.toml.
# Every key is optional; the values shown are the defaults.

[general]
editor = ""          # overrides $VISUAL / $EDITOR, e.g. "nvim"
layout = "split"     # "split" or "full"
split_ratio = 0.55   # calendar share of the width in split mode
mouse = true         # clicks and wheel; hold Shift to select text in the terminal

[calendar]
week_start = "monday"     # or "sunday"
default_view = "month"    # "month", "days" (3 days), "week" or "agenda"
agenda_days = 14
default_duration = "1h"   # length of new timed events
time_format = "15:04"
show_tasks = true         # list tasks with a due date in the calendar
dim_past = true           # grey out events that have already ended

[tasks]
default_view = "today"    # "today", "upcoming" or "all" (keys 1/2/3 in the tasks pane)
# Grouping per view: "project", "date" (overdue/today/tomorrow/…), "day" or "label".
# `s` changes it while the app runs; these are the startup defaults.
group_today = "date"
group_upcoming = "day"
group_all = "project"
show_completed = false

[sync]
interval = "5m"

[google]
# Your own Desktop OAuth client JSON from Google Cloud Console (see README).
# Leave empty to use the client built into release binaries.
client_secret_file = ""
calendars = []            # names or ids to sync; empty = all
exclude_calendars = []    # names or ids never synced, e.g. ["Todoist"]
past_days = 365           # how far back the first full sync reaches

[reminders]
# Defaults for events that do not set their own `reminders` (see `e` in the app).
# Reminders are CalDo-only: they are not synced to Google Calendar.
timed = ["10m"]           # before the start: "10m", "1h30m", "1d"
all_day = ["09:00"]       # on the day at 09:00; "-1d 18:00" = the day before at 18:00
tasks = ["0m"]            # tasks due at a time: "0m" = at the due time, "15m" = 15 min before
tasks_all_day = []        # tasks due on a date only, e.g. ["09:00"]; empty = no notification
urgency = "critical"      # notify-send urgency: "low", "normal" or "critical"

[theme]
accent = "#7aa2f7"
muted = "#565f89"
border = "#3b4261"
today = "#e0af68"
success = "#9ece6a"
pending = "#bb9af7"
warning = "#e0af68"
danger = "#f7768e"
selection = "#283457"
selection_fg = ""         # text color of the selected row; empty keeps it
p1 = ""                   # priority colors; empty = danger, warning, accent
p2 = ""
p3 = ""

# Rebind any action; listed actions replace their defaults.
# Key names follow Bubble Tea: "space", "enter", "tab", "ctrl+n", "left", "pgdown"…
[keys]
# toggle_focus = ["space"]
# toggle_split = ["\\"]
# complete = ["x", "c"]
